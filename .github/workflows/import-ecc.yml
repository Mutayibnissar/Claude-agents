name: Import and sync ECC

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy upstream ECC files
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          git clone --depth 1 https://github.com/affaan-m/ECC.git "$tmp/ECC"
          rsync -a --delete --exclude='.git/' --exclude='.github/workflows/import-ecc.yml' "$tmp/ECC/" "$GITHUB_WORKSPACE/"
          rm -rf "$tmp"

      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Repository already matches upstream ECC."
            exit 0
          fi
          git commit -m "Import/sync upstream ECC"
          git push
